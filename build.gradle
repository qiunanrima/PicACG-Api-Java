plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
}

group = 'com.picaapi'
version = '1.0.0'

allprojects {
    repositories {
        mavenCentral()
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    jvmToolchain(17)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        // 让 Java 端也能直接使用接口默认实现（ChatroomListener 可只重写关心的方法）。
        // Emit real JVM default methods so Java callers can override only the callbacks they need.
        freeCompilerArgs.add('-Xjvm-default=all')
    }
}

dependencies {
    api project(':socket-io-client')
    api 'com.squareup.okhttp3:okhttp:5.3.2'
    api 'com.squareup.okhttp3:logging-interceptor:5.3.2'
    api 'com.google.code.gson:gson:2.10.1'
    implementation 'org.json:json:20231013'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.squareup.okhttp3:mockwebserver3:5.3.2'
}

test {
    useJUnitPlatform()
}

tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(':socket-io-client').sourceSets.main.output
    from project(':engine-io-client').sourceSets.main.output
}

tasks.named('sourcesJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(':socket-io-client').sourceSets.main.allSource
    from project(':engine-io-client').sourceSets.main.allSource
}
